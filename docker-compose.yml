version: "3.9"

services:
  app:
    build: .
    container_name: studyroom_app
    command: ["ruby", "grpc_service/server.rb"]
    working_dir: /rails
    volumes:
      - .:/rails
    ports:
      - "9090:9090"
    env_file:
      - .env
      - .env.${RAILS_ENV}
    restart: always
    networks:
      - ban_note_shared_network

  redis:
    image: redis:7
    container_name: studyroom_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ban_note_shared_network

  # ZOOKEEPER (Kafka 3.x에서는 필수)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: studyroom_zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ban_note_shared_network

  # KAFKA BROKER (Karafka 2.5와 가장 안정적인 조합)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: studyroom_kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"   # 외부 접속 포트
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"

      # 리스너 설정
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093

      # Docker 내부에서는 INTERNAL 접속
      # 개발 PC에서는 EXTERNAL 접속(=localhost:9093)
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ban_note_shared_network

  # KARAFKA SERVER (Consumer)
  karafka-server:
    build: .
    container_name: studyroom_karafka_server
    command: ["bundle", "exec", "karafka", "server"]
    working_dir: /rails
    volumes:
      - .:/rails
    env_file:
      - .env
      - .env.${RAILS_ENV}
    restart: always
    depends_on:
      - kafka
    networks:
      - ban_note_shared_network

volumes:
  mysql_data:

networks:
  ban_note_shared_network:
    external: true
